<footer>
  <div class="limiter" *transloco="let t">
    <p class="copyright">© {{ year }} Andre Veltens</p>

    <nav [attr.aria-label]="t('footer.legalNav')">
      <ul>
        <li>
          <a [routerLink]="toPath('legal/legal-notice')" routerLinkActive="active" ariaCurrentWhenActive="page">
            {{ t('nav.legalNotice') }}
          </a>
        </li>
        <li>
          <a [routerLink]="toPath('legal/privacy-policy')" routerLinkActive="active" ariaCurrentWhenActive="page">
            {{ t('nav.privacyPolicy') }}
          </a>
        </li>
      </ul>
    </nav>

    <div class="social">
      <app-tooltip [ariaHidden]="true" text="LinkedIn" position="top-leading">
        <a href="https://www.linkedin.com/in/veltens/"
           target="_blank"
           rel="noopener noreferrer"
           [attr.aria-label]="t('footer.linkedIn')">
          <icon-linkedin aria-hidden="true"/>
        </a>
      </app-tooltip>
      <app-tooltip [ariaHidden]="true" text="GitHub" position="top-leading">
        <a href="https://github.com/swiftAndHandy"
           target="_blank"
           rel="noopener noreferrer"
           [attr.aria-label]="t('footer.github')">
          <img [ngSrc]="colorSchemeService.darkModeIsActive()
               ? '/assets/img/github_logo-dark.svg'
               : '/assets/img/github_logo-light.svg'"
               width="24" height="24" alt=""/>
        </a>
      </app-tooltip>
    </div>
  </div>
</footer>
