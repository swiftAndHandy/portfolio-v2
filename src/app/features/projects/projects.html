<h1 transloco="projects.title"></h1>
<section *transloco="let t">
  <ul class="filter-bar" [aria-label]="t('projects.filter.list')">
    @for (category of filterOptions; track category) {
      <li>
        <button (click)="activeFilter.set(category)"
        [aria-pressed]="activeFilter() === category">{{ t('projects.filter.' + category) }}</button>
      </li>
    }
  </ul>
</section>
<section class="projects-grid">
  @for (project of filteredProjects(); track project.id) {
    <app-project-card [project]="project"/>
  }
</section>
