<dialog #dialog [aria-label]="ariaLabel()">
  <ng-content />
  <div class="resize-handle resize-n" (pointerdown)="startResize($event, 'n')"></div>
  <div class="resize-handle resize-s" (pointerdown)="startResize($event, 's')"></div>
  <div class="resize-handle resize-e" (pointerdown)="startResize($event, 'e')"></div>
  <div class="resize-handle resize-w" (pointerdown)="startResize($event, 'w')"></div>
  <div class="resize-handle resize-ne" (pointerdown)="startResize($event, 'ne')"></div>
  <div class="resize-handle resize-nw" (pointerdown)="startResize($event, 'nw')"></div>
  <div class="resize-handle resize-se" (pointerdown)="startResize($event, 'se')"></div>
  <div class="resize-handle resize-sw" (pointerdown)="startResize($event, 'sw')"></div>
</dialog>
